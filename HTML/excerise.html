<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn" oneclick = "change()">color</button>
    <script>
        var btn = document.getElementById("btn");
        function change(){
          btn.style.backgroundColor ="red";
        }
    </script>
</body>
</html>
