<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>course dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

<body>
    <div class="container py-5">
        <ul class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">home</a></li>
        <li class="breadcrumb-item"><a href="#">Course</a></li>
        <li class="breadcrumb-item"><a href="#">Web Development</a></li>
      </ul>
        <h2 class="heading">Web Development
            <span class="badge bg-success">New</span>
        </h2>
        <label class="fw-bold">Html</label>
        <div class="progress mb-2">
            <div class="progress-bar progress-bar-strip progress-bar-animated bg-success" style="width:100%">100%</div> 
            </div>
             <label class="fw-bold">CSS</label>
            <div class="progress mb-2">
            <div class="progress-bar progress-bar-strip progress-bar-animated bg-primary" style="width:75%">75%</div>
            </div>
             <label class="fw-bold">Javascript</label>
             <div class="progress mb-2">
            <div class="progress-bar progress-bar-strip progress-bar-animated bg-warning" style="width:50%">50%</div>
            </div>
             <label class="fw-bold">Bootstrap</label>
            <div class="progress mb-2">
                <div class="progress-bar progress-bar-strip progress-bar-animated bg-danger" style="width:25%">25%</div>
            </div>
            <div class="btn mb-3">
                <button type="button" class="btn btn-success">Start</button>
                <button type="button" class="btn btn-secondary">Pause</button>
                <button type="button" class="btn btn-danger">Reset</button>
            </div>
            <div class="navigation page">
                <ul class="pagination justify-content-center">
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
                </ul>
            </div>

        
    </div>
