<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Contact Card</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      overflow: scroll;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 18px;
      text-align: center;
      color: white;
      background: #19376d;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      padding: 100px 24px;
    }

    .profile-section {
      position: relative;
      max-width: 1000px;
      min-height: 300px;
      margin: auto;
      padding: 36px 300px 36px 36px;
      overflow: auto;
      background: white;
      border-radius: 12px;
    }

    .profile-image {
      float: left;
      width: 170px;
      height: 170px;
      margin-right: 30px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-content {
      text-align: center;
    }

    .contact-info {
      position: absolute;
      top: 36px;
      right: 36px;
      width: 230px;
      padding: 20px;
      overflow: scroll;
      text-align: center;
      background: #edf4ff;
      border-left: 6px solid #4c7cc1;
    }

    .contact-info strong {
      display: block;
    }
  </style>
</head>
<body>
  <header>Company Contact Card</header>

  <main>
    <section class="profile-section">
      <img class="profile-image"
        src="WhatsApp Image 2026-07-28 at 8.34.58 AM.jpeg"
        alt="Employee profile photo">

      <div class="profile-content">
        <h1>Rahul M</h1>
        <h3>Web Designer</h3>
        <p>
          rahul M creates clear, thoughtful digital experiences that help people
          do their best work.
        </p>
      </div>

      <aside class="contact-info">
        <h2>Contact Info</h2>
        <p><strong>Phone</strong>+91 6238665543 </p>
        <p><strong>Email</strong> rahul@gmail.com</p>
        <p><strong>Office</strong>techno park tvm</p>
      </aside>
    </section>
  </main>
</body>
</html>
