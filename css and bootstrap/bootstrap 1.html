<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    <body class="bg-primary justify-content-center">
<div class="container mt-5">

    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-body">


            <h1 class="font-weight-bold">
                Sign Up
            </h1>
            <p class="text-muted">Please fill in this form to create an account!</p>
            <hr>
  <div class="row">
    <div class=" form-group col-md-6">
      <input type="text" class="form-control bg-light" placeholder="Enter firstname">
    </div>
    <div class=" form-group col-md-6">
      <input type="text" class="form-control bg-light" placeholder="Enter lastname">
    </div>
  </div> 
  <div class="form-group">
      <input type="email" class="form-control bg-light" placeholder="Enter email">
    </div>
          <div class="form-group">
      <input type="password" class="form-control bg-light" placeholder="Enter password">
    </div> 
    <div class="form-group">
      <input type="password" class="form-control bg-light" placeholder="confirm password">
    </div> 
    <div class="form-group form-check">

                    <input type="checkbox"
                           class="form-check-input"
                           id="terms">

                    <label class="form-check-label" for="terms">
                        I accept the
                        <a href="#">Terms of Use</a>
                        &amp;
                        <a href="#">Privacy Policy</a>.
                    </label>
    </div>
      <button type="submit"
                        class="btn btn-primary btn-lg"
                        style="width: 50%;">
                    Sign Up
                </button>
    </div>
    </div>
    <div class="text-center text-white mt-3">Already have an account?<a href="#" class="text-white">Login here</a></div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
</body>
</html>
