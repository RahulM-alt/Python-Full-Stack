<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    <div class="text-center">
    <h2>Feedback From</h2>
</div>
    <div class="form-group ml-3">
      <label for="name">Name:</label>
      <input type="text" class="form-control" id="email" placeholder="Enter your full name" name="Name">
    </div>
    <div class="form-group ml-3">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="pwd" placeholder="Enter your email" name="email">
    </div>
    <div class="form-group ml-3">
  <label for="comment">Feedback:</label>
  <textarea class="form-control" rows="3" id="Feedback" placeholder="Enter your feedback"></textarea>
</div>
<div class="input-group mt-3 mb-3 ml-3">
 <p>How did you find our site?</p><br>
 </div>
 <div class="input-group mt-3 mb-3 ml-3">
  <div class="input-group-prepend">
    <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-toggle="dropdown">
      Select an option
    </button>|
    <div class="dropdown-menu">
      <a class="dropdown-item" href="#">Instagram</a>
      <a class="dropdown-item" href="#">facebook</a>
      <a class="dropdown-item" href="#">Friend</a>
      <a class="dropdown-item" href="#">Google</a>
      <a class="dropdown-item" href="#">Other</a>
    </div>
  </div>
  </div>
  </div>
  
  <div class="form-group ml-3">

                    <label>
                        Satisfaction Level
                    </label>

                    <div class="form-check">
                        <input type="radio"
                               class="form-check-input"
                               name="satisfaction"
                               id="one"
                               value="1">

                        <label class="form-check-label" for="one">
                            1
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio"
                               class="form-check-input"
                               name="satisfaction"
                               id="two"
                               value="2">

                        <label class="form-check-label" for="two">
                            2
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio"
                               class="form-check-input"
                               name="satisfaction"
                               id="three"
                               value="3">

                        <label class="form-check-label" for="three">
                            3
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio"
                               class="form-check-input"
                               name="satisfaction"
                               id="four"
                               value="4">

                        <label class="form-check-label" for="four">
                            4
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio"
                               class="form-check-input"
                               name="satisfaction"
                               id="five"
                               value="5">

                        <label class="form-check-label" for="five">
                            5
                        </label>
                    </div>

                </div>
<div class="button ml-3">
    <button type="submit" class="btn btn-primary">Submit</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
</body>
</html>
