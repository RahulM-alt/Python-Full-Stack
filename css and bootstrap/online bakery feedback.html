<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    <div class="heading text-center">
    <h1>Online bakery Feedback Form</h1>
    </div>
<div class="form-group">
      <label for="name">Customer name:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your name" name="email">
    </div>
    <div class="form-group">
      <label for="pwd">email</label>
      <input type="email" class="form-control" id="email" placeholder="Enter yor email" name="email">
    </div>
    <div class="form-group">
        <label for="feedback">Feedback message</label>
        <textarea class="form-group-control"
        id="feedback"
        rows="5"
        cols="50"
        placeholder="enter your feedback"required></textarea>
    </div>
<div class="form-group">

                    <label>Preferred Contact Method</label>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="contact"
                               id="emailContact"
                               value="email">

                        <label class="form-check-label"
                               for="emailContact">
                            Email
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input"
                               type="radio"
                               name="contact"
                               id="phoneContact"
                               value="phone">

                        <label class="form-check-label"
                               for="phoneContact">
                            Phone
                        </label>
                    </div>

                </div>

                <!-- Satisfaction -->
                <div class="form-group">

                    <label for="satisfaction">
                        Satisfaction Level: 1 - 10
                    </label>

                    <input type="range"
                           class="custom-range"
                           id="satisfaction"
                           min="1"
                           max="10">

                </div>

                <!-- Order Type -->
                <div class="form-group">

                    <label for="orderType">
                        Type of Order
                    </label>

                    <select class="form-control"
                            id="orderType">

                        <option selected disabled>
                            Select Order Type
                        </option>

                        <option>Cake</option>
                        <option>Cookies</option>
                        <option>Pastries</option>

                    </select>

                </div>

                <!-- Submit -->
                <div class="text-center">

                    <button type="submit" value="submit" id="submit"
                            class="btn btn-primary">
                        Submit Feedback
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

    <button type="submit" class="btn btn-primary">Submit</button>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
</body>
</html>
