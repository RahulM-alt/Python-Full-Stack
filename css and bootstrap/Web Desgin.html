<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Web Desgin</title>
<style>
    
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#ebebeb;
   
    
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    width:360px;
    background:#fff;
    border-radius:25px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
}
.card-top{
    background:#133b50;
    border-radius:20px;
    padding:25px;
}
.card-top h1{
    font-size:45px;
    margin-bottom:15px;
}
.card-top p{
    font-size:20px;
    color:#0a0000;
    line-height:1.5;
    margin-bottom:20px;
}
.tags{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}
.tags span{
    background:#42a0cf;
    padding:10px 18px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
}
.card-bottom{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.card-bottom h2{
    font-size:42px;
}
.arrow{
    width:60px;
    height:60px;
    border:none;
    border-radius:18px;
    background:#875c5c;
    font-size:30px;
    cursor:pointer;
}
.arrow:hover{
    background:#0d3e55;
}


    
</style>
</head>

<body>

<div class="card">
    <div class="card-top">
        <h1>Web Design</h1>
        <p>Crafts engaging, user-friendly websites.</p>

        <div class="tags">
            <span>Landing Page</span>
            <span>Website</span>
            <span>One Page</span>
        </div>
    </div>

    <div class="card-bottom">
        <h2>Explore</h2>
        <button class="arrow">&#8594;</button>
    </div>
</div>

</body>
</html>
